services:
  - type: web
    name: restaurant
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString
      - key: PLATFORM_OWNER_USERNAME
        sync: false
      - key: PLATFORM_OWNER_PASSWORD
        sync: false

databases:
  - name: restaurant-db
    plan: free
    databaseName: restaurant
    user: restaurant